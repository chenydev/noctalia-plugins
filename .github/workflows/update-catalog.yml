name: Update catalog

on:
  push:
    branches: [main]
    paths:
      - "*/plugin.toml"
      - "scripts/update-catalog.py"

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate catalog.toml
        run: python3 scripts/update-catalog.py
      - name: Commit catalog.toml if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet catalog.toml; then
            git add catalog.toml
            git commit -m "chore(catalog): regenerate catalog.toml"
            git push
          fi
